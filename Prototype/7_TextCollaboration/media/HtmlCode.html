<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutli user text</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        #textbox {
            width: 100%;
            height: 200px;
            font-size: 16px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Multi-user Text Box</h1>
    <textarea id="textbox" placeholder="Start typing..."></textarea>
    <script>
        const socket = io();
        // Reference to the text box
        const textbox = document.getElementById('textbox');
        // Listen for changes in the text box and send to server
        textbox.addEventListener('input', () => {
            socket.emit('text_update', { content: textbox.value });
        });
        // Listen for updates from the server and update the text box
        socket.on('text_update', (data) => {
            if (textbox.value !== data.content) {
                textbox.value = data.content;
            }
        });
    </script>
</body>
</html>
