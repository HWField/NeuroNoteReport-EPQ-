<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purple to Blue Gradient Title</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
    }
    .gradient-title {
      font-size: 20rem;
      font-weight: bold;
      background-image: linear-gradient(90deg, #A100FFFF 0%, #71C4FFFF 100%);
      background-size: 100% 100%;
      background-position: 0px 0px;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      text-align: center;
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <h1 class="gradient-title">NeuroNote</h1>
</body>
</html>
